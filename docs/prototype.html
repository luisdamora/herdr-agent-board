<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Herdr — Agent Board layout prototypes</title>
<style>
:root{--canvas:#0d1017;--chrome:#11141c;--surface:#151923;--background:#0f121a;--border:#252a36;--muted:#7c8496;--foreground:#d7dbe4;--accent:#ff79c6;--working:#f1c35a;--done:#6aa2ff;--blocked:#ef7777;--idle:#566070;--selected:#1b2030}
*{box-sizing:border-box}body{margin:0;background:#07090d;color:var(--foreground);font:13px/1.35 Geist,system-ui,sans-serif}
header{display:flex;gap:16px;align-items:center;padding:14px 20px;border-bottom:1px solid var(--border);flex-wrap:wrap}h1{font-size:15px;margin:0}.seg{display:flex;gap:3px;background:var(--surface);padding:3px;border:1px solid var(--border);border-radius:8px}button{font:inherit;cursor:pointer;background:none;border:0;color:var(--muted);padding:6px 10px;border-radius:6px}button.on{background:var(--selected);color:var(--foreground)}label,.desc{color:var(--muted)}.desc{padding:10px 20px;min-height:38px}.stage{padding:0 20px 24px}.win{height:calc(100vh - 150px);min-height:560px;display:flex;background:var(--canvas);border:1px solid var(--border);border-radius:10px;overflow:hidden}
body.preview header,body.preview .desc{display:none}body.preview .stage{padding:0}body.preview .win{height:100vh;min-height:0}
.col{display:flex;flex-direction:column;min-width:0;min-height:0}.sidebar{width:250px;background:var(--chrome);border-right:1px solid var(--border);flex:none}.brand{height:46px;padding:0 14px;display:flex;align-items:center;gap:8px;font-weight:600}.spacer{flex:1}.section{font-size:12px;color:var(--muted);padding:10px 14px 6px;display:flex;justify-content:space-between}.list{overflow:auto;flex:1;min-height:0}.item{display:flex;gap:8px;align-items:center;padding:6px 14px;white-space:nowrap;overflow:hidden}.item .name{flex:1;overflow:hidden;text-overflow:ellipsis}.item.selected{background:var(--selected);border-radius:6px;margin:0 6px;padding:6px 8px}.branch,.muted{color:var(--muted)}.branch{font-size:11px;overflow:hidden;text-overflow:ellipsis}.badge{width:18px;height:18px;border-radius:4px;display:grid;place-items:center;font-size:11px;color:white;flex:none}.footer{height:69px;padding:10px 14px;color:var(--muted);display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--border)}.tabs{height:42px;flex:none;display:flex;align-items:center;gap:6px;padding:0 10px;border-bottom:1px solid var(--border);background:var(--chrome)}.pill{padding:4px 10px;border-radius:6px;color:var(--muted)}.pill.on{background:var(--surface);color:var(--foreground)}.body{flex:1;padding:8px;gap:8px;display:flex;min-height:0}.panes{flex:1;display:grid;gap:8px;min-width:0}.pane{background:var(--background);border:1px solid var(--border);border-radius:10px;display:flex;flex-direction:column;min-height:0;overflow:hidden}.pane.focus{border-color:var(--accent)}.pane-header{height:30px;flex:none;display:flex;align-items:center;gap:8px;padding:0 12px;color:var(--muted);border-bottom:1px solid var(--border);font-size:12px}.terminal{flex:1;padding:14px;font:12px/1.6 "JetBrains Mono",monospace;overflow:hidden}.accent{color:var(--accent)}.yellow{color:var(--working)}.panel{width:360px;flex:none;background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:auto}.board-header{display:flex;align-items:center;padding:6px 8px;height:40px;color:var(--muted);font-weight:600}.board-header button{color:var(--accent);font-size:20px;padding:0 8px}.heading{display:flex;gap:8px;padding:12px 14px 8px;font-size:11px;text-transform:uppercase;font-weight:600}.count{margin-left:auto;color:var(--muted);text-transform:none}.card{margin:0 10px 8px;padding:10px 12px;border:1px solid var(--border);border-radius:9px;background:var(--background)}.card.current{border:2px solid var(--accent);background:var(--selected)}.title{display:flex;gap:8px;align-items:center}.title b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.age{margin-left:auto;color:var(--muted);font-size:11px;white-space:nowrap}.meta{color:var(--muted);font-size:11.5px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.open{margin-left:auto;font-size:11px;background:#20263a;padding:3px 8px;border-radius:5px;color:var(--done);white-space:nowrap}.dot{width:8px;height:8px;flex:none;border:1.5px solid var(--idle);border-radius:50%;display:inline-block}.dot.working{width:12px;height:12px;border-color:var(--working);border-right-color:transparent}.dot.done{background:var(--done);border-color:var(--done)}.dot.blocked{background:var(--blocked);border-color:var(--blocked)}.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.chip{font-size:11px;padding:3px 7px;border-radius:99px;background:#20263a;display:flex;align-items:center;gap:5px}.bucket{font-size:11px;color:var(--muted);padding:8px 14px 3px}.rest .item{padding:5px 14px;font-size:12.5px}.sleeping{display:flex;flex-wrap:wrap;gap:5px;padding:4px 14px 10px}.sleeping .chip{opacity:.55}.status{height:28px;flex:none;display:flex;align-items:center;gap:16px;padding:0 12px;color:var(--muted);font-size:11px;border-top:1px solid var(--border);background:var(--chrome)}.strip{width:440px;min-width:220px;display:flex;justify-content:flex-end;gap:6px;align-items:center;overflow:hidden}.agent-pill{display:flex;gap:6px;align-items:center;padding:1px 8px;border-radius:99px;background:var(--surface);border:1px solid var(--border);white-space:nowrap}.agent-pill.current{border-color:var(--accent);background:var(--selected)}.here{color:var(--accent)}
</style>
</head>
<body>
<header><h1>Herdr · Layout prototypes</h1><div class="seg" id="switcher"><button data-view="original">Original</button><button data-view="a">A · Agents on the right</button><button data-view="b">B · Balanced sidebar</button><button data-view="c">C · Tabbed panel</button><button data-view="d" class="on">D · Activity board</button></div><label><input type="checkbox" id="grid"> 2×2 terminal grid</label></header>
<div class="desc" id="description"></div><div class="stage"><div class="win" id="window"></div></div>
<script>
// Static, neutral sample data. This prototype never connects to Herdr.
const spaces = [
 ['A','#3b6fd8','api-server','main'],['W','#8b5cf6','web-app','feat/login-flow'],
 ['M','#22a06b','mobile-app','fix/cart-totals'],['D','#14b8a6','docs-site','docs/getting-started'],
 ['T','#f97316','test-suite','main'],['S','#3b82f6','search-service','feat/search'],
 ['U','#8b5cf6','ui-library','main'],['J','#22a06b','job-runner','main']
];
const working = [['api-server','api-server · main','<1m',[],true],['feat/login-flow','web-app · feat/login-flow','3m',['unit-tests','accessibility-check'],false]];
const recent = [['docs-site','53m']];
const today = [['search-service','19h'],['ui-library','23h']];
const sleeping = [['job-runner','1d'],['test-suite','2d'],['mobile-app','3d']];
const dot = state => `<span class="dot ${state}"></span>`;
const brand = '<div class="brand">🐑 Herdr <span class="spacer"></span><span class="muted">⌕ ▯</span></div>';
const footer = '<div class="footer"><span>⚙ Settings</span><span>+ Add machine</span></div>';
function spaceList(){return `<div class="section">Spaces <span>+</span></div><div class="list">${spaces.map(([letter,color,name,branch])=>`<div class="item ${name==='api-server'?'selected':''}"><span class="badge" style="background:${color}">${letter}</span><span class="name">${name}</span><span class="branch">${branch}</span></div>`).join('')}</div>`;}
function idleRows(rows,dim=false){return rows.map(([name,age])=>`<div class="item" style="opacity:${dim ? 0.7 : 1}">${dot('idle')}<span class="name">${name}</span><span class="age">${age}</span></div>`).join('');}
function board(){return `<div class="board-header">Agents<span class="spacer"></span><button title="Static prototype: collapse is available in the real mod">›</button></div>
 <div class="heading" style="color:var(--done)">Needs you<span class="count">1</span></div>
 <div class="card"><div class="title">${dot('done')}<b>fix/cart-totals</b><span class="open">Open ↵</span></div><div class="meta">mobile-app · Done · unreviewed · &lt;1m</div></div>
 <div class="heading" style="color:var(--working)">Working<span class="count">2 · 2 sub-agents</span></div>
 ${working.map(([name,space,age,children,current])=>`<div class="card ${current?'current':''}"><div class="title">${dot('working')}${current?'<span class="here" title="You are here">▣</span>':''}<b>${name}</b><span class="age">${age}</span></div><div class="meta">${space}</div>${children.length?`<div class="chips">${children.map(name=>`<span class="chip">${dot('working')}${name}</span>`).join('')}</div>`:''}</div>`).join('')}
 <div class="heading" style="color:var(--idle)">Idle<span class="count">6</span></div><div class="rest"><div class="bucket">Last hour</div>${idleRows(recent)}<div class="bucket">Today</div>${idleRows(today,true)}<div class="bucket">Sleeping · over 1 day <span style="float:right">3 ▾</span></div><div class="sleeping">${sleeping.map(([name,age])=>`<span class="chip">${name} · ${age}</span>`).join('')}</div></div>`;}
function simpleAgents(){return `<div class="section">Agents</div><div class="list">${idleRows([['fix/cart-totals','<1m'],['api-server','<1m'],['feat/login-flow','3m'],...recent,...today,...sleeping])}</div>`;}
function files(){return `<div class="section">Files</div>${['src/','tests/','docs/','.gitignore','README.md','package.json'].map(name=>`<div class="item">${name.endsWith('/')?'▸ 📁':'📄'} ${name}</div>`).join('')}`;}
function terminals(grid){return `<div class="panes" style="grid-template-columns:${grid?'1fr 1fr':'1fr'};grid-template-rows:${grid?'1fr 1fr':'1fr'}">${(grid?['api-server','web-app','mobile-app','docs-site']:['api-server']).map((name,index)=>`<div class="pane ${index===0?'focus':''}"><div class="pane-header"><b>π</b> Pi <span>~/projects/${name}</span><span class="spacer"></span>${dot(index===2?'done':'working')}</div><div class="terminal"><span class="accent">✿ ${name}</span> │ main │ <span class="yellow">Agent session</span><br><br><span class="muted">Thinking…</span><br><br><span class="yellow">$ npm test</span><br>All tests passed.<br><br><span class="accent">›</span> <span class="muted">type, or / for commands</span></div></div>`).join('')}</div>`;}
function strip(){return '<div class="strip"><span class="agent-pill">'+dot('done')+'fix/cart-tot…</span><span class="agent-pill current">'+dot('working')+'api-server <span class="here">▣</span></span><span class="agent-pill">'+dot('working')+'feat/login… +2</span><span>· 6 idle</span></div>';}
const descriptions={original:'Original: a 480px sidebar splits space between Spaces and Agents; Files stays on the right.',a:'A · Agents on the right: a narrow Spaces sidebar, with Agents above Files.',b:'B · Balanced sidebar: a 320px sidebar gives Agents twice the height of Spaces.',c:'C · Tabbed panel: Agents, Files and Changes share a full-height right panel.',d:'D · Activity board: Needs you first, then Working and time-bucketed Idle agents. The active-agent strip stays in the status bar. This is a static visual reference, not a live mod.'};
let view='d';
if(new URLSearchParams(location.search).has('preview')) document.body.classList.add('preview');
function render(){
 const grid=document.getElementById('grid').checked;
 const sidebarWidth=view==='original'?480:view==='b'?320:250;
 const leftAgents=view==='original'||view==='b';
 const sidebar=`<div class="col sidebar" style="width:${sidebarWidth}px">${brand}<div class="col" style="flex:1">${spaceList()}</div>${leftAgents?`<div class="col" style="flex:${view==='b'?2:1}">${simpleAgents()}</div>`:''}${footer}</div>`;
 const right=view==='d'?`<div class="panel">${board()}</div>`:view==='c'?`<div class="panel"><div class="seg" id="panel-tabs"><button data-panel="agents" class="on">Agents</button><button data-panel="files">Files</button><button data-panel="changes">Changes</button></div><div id="panel-content">${simpleAgents()}</div></div>`:view==='a'?`<div class="col panel"><div class="col" style="flex:3">${simpleAgents()}</div><div style="flex:2">${files()}</div></div>`:`<div class="panel">${files()}</div>`;
 document.getElementById('description').textContent=descriptions[view];
 document.getElementById('window').innerHTML=`${sidebar}<div class="col" style="flex:1"><div class="tabs"><span class="pill on">π 1 ×</span><span class="pill">›_ 2</span><span class="spacer"></span><span class="muted">− ▢ ×</span></div><div class="body">${terminals(grid)}${right}</div><div class="status"><span>▭ This computer</span><span>⑂ main</span><span>● 9 agents</span><span class="spacer"></span>${view==='d'?strip():'<span>Ctrl+Shift+P commands</span>'}</div></div>`;
 const tabs=document.getElementById('panel-tabs');
 if(tabs) tabs.onclick=event=>{const panel=event.target.dataset.panel;if(!panel)return;tabs.querySelectorAll('button').forEach(button=>button.classList.toggle('on',button.dataset.panel===panel));document.getElementById('panel-content').innerHTML=panel==='agents'?simpleAgents():panel==='files'?files():'<div class="section">Changes</div><div class="item muted">No changes</div>';};
}
document.getElementById('switcher').onclick=event=>{if(!event.target.dataset.view)return;view=event.target.dataset.view;document.querySelectorAll('#switcher button').forEach(button=>button.classList.toggle('on',button.dataset.view===view));render();};
document.getElementById('grid').onchange=render;
render();
</script>
</body>
</html>
